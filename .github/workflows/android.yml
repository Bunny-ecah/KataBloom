name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build, test and check
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: DysLearn-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-reports-${{ github.run_number }}
          path: app/build/reports/
          retention-days: 14
